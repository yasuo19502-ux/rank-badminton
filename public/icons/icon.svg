<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Shuttlecock feathers -->
  <g filter="url(#glow)">
    <!-- Outer feathers glow -->
    <path d="M168 128 L232 290 L280 290 L344 128 C344 128 316 142 256 142 C196 142 168 128 168 128 Z" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="4"/>
    <!-- Feather ribs -->
    <line x1="184" y1="134" x2="236" y2="290" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="140" x2="246" y2="290" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="256" y1="142" x2="256" y2="290" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
    <line x1="292" y1="140" x2="266" y2="290" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="328" y1="134" x2="276" y2="290" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Cross threads -->
    <path d="M196 195 Q256 210 316 195" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
    <path d="M214 245 Q256 256 298 245" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

    <!-- Cork Base (Quả cầu) -->
    <path d="M230 294 L282 294 C282 294 286 352 256 352 C226 352 230 294 230 294 Z" fill="url(#goldGrad)" stroke="#d97706" stroke-width="4"/>
    <!-- Cork ribbon -->
    <rect x="230" y="296" width="52" height="12" fill="#ef4444" rx="2"/>
  </g>

  <!-- Stars or Badges -->
  <circle cx="256" cy="406" r="6" fill="#10b981"/>
  <circle cx="226" cy="406" r="4" fill="#38bdf8"/>
  <circle cx="286" cy="406" r="4" fill="#38bdf8"/>
</svg>
